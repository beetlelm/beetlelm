run_name: beetle-bilingual-balanced-b1-fineweb-500m-nld-eng
hf_user: Beetle-FineWeb
model:
  architecture: pico
  params:
    n_layers: 24
    d_model: 1152
    vocab_size: 50000
    attention_n_heads: 16
    attention_n_kv_heads: 4
    max_seq_len: 512
    batch_size: 32
    position_emb_theta: 10000.0
    activation_hidden_dim: 4608
    norm_eps: 1.0e-05
    dropout: 0.1
data:
  data_mix: B1
  lang_sources:
  - Beetle-Data/nl-28B
  l2_streams:
  - Beetle-Data/en-for-nl-28B
  pretokenized: true
  pretokenized_cache_dir: ./pretok_cache/beetle-bilingual-balanced-b1-fineweb-nld-eng
tokenizer:
  pretrained_tokenizer_path: Beetle-Data/tokenizer-nl-en
  dataset_source: fineweb
  vocab_size: 50000
  vocab_sharing: shared
  type: bpe
  target_tokens: 1000000000
  output_dir: ./tokenizers/fineweb_nld_L1-eng_L2_shared
  overwrite: false
  push_to_hub: false
training:
  max_steps: 45776
  batch_size: 32
  seq_len: 512
  target_effective_batch: 1024
  fabric:
    accelerator: cuda
    devices: 8
    strategy: ddp
    precision: bf16-mixed
  optimization:
    optimizer: adamw
    lr: 0.00041
    weight_decay: 0.01
    lr_warmup_steps: 750
    lr_scheduler: linear_with_warmup
checkpointing:
  runs_dir: ./runs
  auto_resume: false
  save_to_hf: true
  export_final_only: false
  keep_local_checkpoints: 1
  checkpoint_steps:
  - 0
  - 1
  - 2
  - 4
  - 6
  - 8
  - 16
  - 64
  - 256
  - 1024
  - 4096
  - 16384
  - 45776
curriculum:
  type: smooth
  condition: B1
  mode: tokens
ewc:
  enabled: false
maml:
  enabled: false
generative_replay:
  enabled: false
polca:
  enabled: true
  every_n_steps: 500
  k_eigenvectors: 32
  basis_rank: 32
  holdout_batch_size: 8
  holdout_seq_len: 512
  artifact_dir: polca
  push_to_hf: true
  precision: fp32
