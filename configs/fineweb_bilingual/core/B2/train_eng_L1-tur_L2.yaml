run_name: beetle-bilingual-l2-50-simultaneous-b2-fineweb-eng-tur
hf_user: Beetle-FineWeb2-24B
model:
  architecture: pico
  params:
    n_layers: 14
    d_model: 768
    vocab_size: 50000
    attention_n_heads: 12
    attention_n_kv_heads: 1
    max_seq_len: 512
    batch_size: 8
    position_emb_theta: 10000.0
    activation_hidden_dim: 3072
    norm_eps: 1.0e-05
    dropout: 0.1
data:
  data_mix: B2
  lang_sources:
  - Beetle-Data/en-for-tr-28B
  l2_streams:
  - Beetle-Data/tr-28B
  pretokenized: true
  pretokenized_cache_dir: ./pretok_cache/beetle-bilingual-l2-50-simultaneous-b2-fineweb-eng-tur
tokenizer:
  pretrained_tokenizer_path: Beetle-Data/tokenizer-tr-en
  dataset_source: fineweb
  vocab_size: 50000
  vocab_sharing: shared
  type: bpe
  target_tokens: 1000000000
  output_dir: ./tokenizers/fineweb_eng_L1-tur_L2_shared
  overwrite: false
  push_to_hub: true
training:
  max_steps: 91552
  batch_size: 8
  seq_len: 512
  target_effective_batch: 512
  fabric:
    accelerator: cuda
    devices: 4
    strategy: ddp
    precision: bf16-mixed
  optimization:
    optimizer: adamw
    lr: 0.0005
    lr_warmup_steps: 625
    lr_scheduler: linear_with_warmup
checkpointing:
  runs_dir: ./runs
  auto_resume: false
  save_to_hf: true
  export_final_only: false
  keep_local_checkpoints: 1
  checkpoint_every_n_steps: 4577
  checkpoint_steps:
  - 0
  - 1
  - 2
  - 4
  - 6
  - 8
  - 16
  - 64
  - 256
  - 1024
  - 4096
  - 16384
  - 45776
  - 45777
  - 45778
  - 45780
  - 45782
  - 45784
  - 45792
  - 45840
  - 46032
  - 46800
  - 49872
  - 62160
  - 65536
curriculum:
  type: smooth
  condition: B2
  mode: tokens
ewc:
  enabled: false
maml:
  enabled: false
generative_replay:
  enabled: false
polca:
  enabled: true
  every_n_steps: 500
  k_eigenvectors: 32
  basis_rank: 32
  holdout_batch_size: 8
  holdout_seq_len: 512
  artifact_dir: polca
  push_to_hf: true
  precision: fp32
