# tiny_cpu.yaml — the newcomer CPU quickstart (used by `beetlelm-toy`).
# Trains a ~0.7M-parameter PicoDecoder on the in-repo bilingual byte corpus.
# Runs on a laptop CPU in ~15 seconds with no downloads.
run_name: "beetlelm-tiny-cpu"

model:
  architecture: "pico"
  params:
    n_layers: 4
    d_model: 128
    attention_n_heads: 4
    attention_n_kv_heads: 4
    max_seq_len: 128
    activation_hidden_dim: 256
    norm_eps: 1.0e-5
    dropout: 0.0
    # vocab_size is set automatically from the byte tokenizer (256).

tokenizer:
  type: "byte"          # download-free UTF-8 byte vocabulary (256 tokens)
  max_length: 128

data:
  train_file: "data/toy_corpus.txt"
  val_fraction: 0.1

training:
  max_steps: 200
  batch_size: 16
  seq_len: 128
  lr: 3.0e-3
  weight_decay: 0.01
  warmup_steps: 10
  grad_clip: 1.0
  seed: 42
  log_every: 20
  eval_every: 50
  device: "cpu"
  output_dir: "runs/tiny_cpu"
