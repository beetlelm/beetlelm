run_name: beetlelm_eng_L1-zho_L2-deu_L3_T3
hf_user: Beetle-HumanScale
model:
  architecture: pico
  params:
    n_layers: 14
    d_model: 768
    vocab_size: 50000
    attention_n_heads: 12
    attention_n_kv_heads: 1
    max_seq_len: 512
    batch_size: 64
    position_emb_theta: 10000.0
    activation_hidden_dim: 3072
    norm_eps: 1.0e-05
    dropout: 0.1
data:
  data_mix: T3
  lang_sources:
    eng: Beetle-HumanScale/eng-33M-deu-eng-zho
    zho: Beetle-HumanScale/zho-33M-deu-eng-zho
    deu: Beetle-HumanScale/deu-33M-deu-eng-zho
  pretokenized: true
  pretokenized_cache_dir: ./pretok_cache/beetlelm_eng_L1-zho_L2-deu_L3_T3
tokenizer:
  pretrained_tokenizer_path: Beetle-HumanScale/bpe-humanscale-zho-eng-deu
  dataset_source: babybabel
  vocab_size: 50000
  vocab_sharing: shared
  type: bpe
  target_tokens: 100000000
  output_dir: ./tokenizers/eng_L1-zho_L2-deu_L3_shared
  overwrite: false
  push_to_hub: true
training:
  max_steps: 10000
  batch_size: 64
  seq_len: 512
  target_effective_batch: 64
  fabric:
    accelerator: cuda
    devices: 4
    strategy: ddp
    precision: bf16-mixed
  optimization:
    optimizer: adamw
    lr: 0.0005
    lr_warmup_steps: 500
    lr_scheduler: linear_with_warmup
    exposure_lr:
      warmup_tokens: 3300000
      total_tokens: 100000000
      plasticity_boost: 1.5
      min_lr_frac: 0.1
      decay_shape: cosine
checkpointing:
  runs_dir: ./runs
  auto_resume: true
  save_to_hf: true
  export_final_only: false
  keep_local_checkpoints: 1
  learning_dynamics:
    enabled: true
    log_every_n_steps: 1
    batch_size: 64
    sequence_idx: -1
    layer_suffixes:
    - attention
    - swiglu
    - norm
    compute_gradients: false
    learning_dynamics_dir: learning_dynamics
    save_training_batch: true
    cleanup_local: true
    keep_n_local: 1
  checkpoint_steps:
  - 0
  - 1
  - 2
  - 4
  - 6
  - 8
  - 16
  - 32
  - 64
  - 128
  - 256
  - 512
  - 1024
  - 2048
  - 4096
  - 8192
curriculum:
  type: smooth
  condition: T3
  lang_keys:
  - eng
  - zho
  - deu
  mode: steps
ewc:
  enabled: true
  lambda_: 15.0
  n_fisher_samples: 10
  mu: 0.0
  trigger: phase_change
maml:
  enabled: true
  hybrid_ratio: 0.35
  n_way: 5
  k_shot: 1
  inner_steps: 3
  inner_lr: 0.1
  head:
    num_layers: 2
    hidden_dim: 256
    init_method: xavier
generative_replay:
  enabled: false
