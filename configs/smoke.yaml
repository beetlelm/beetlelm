# smoke.yaml — the smallest possible run, used by the test suite and CI.
# A handful of steps on a tiny model; finishes in a few seconds on CPU.
run_name: "beetlelm-smoke"

model:
  architecture: "pico"
  params:
    n_layers: 2
    d_model: 64
    attention_n_heads: 4
    attention_n_kv_heads: 4
    max_seq_len: 64
    activation_hidden_dim: 128
    dropout: 0.0

tokenizer:
  type: "byte"
  max_length: 64

data:
  train_file: "data/toy_corpus.txt"
  val_fraction: 0.1

training:
  max_steps: 3
  batch_size: 4
  seq_len: 64
  lr: 3.0e-3
  warmup_steps: 1
  seed: 0
  log_every: 1
  device: "cpu"
  output_dir: "runs/smoke"
