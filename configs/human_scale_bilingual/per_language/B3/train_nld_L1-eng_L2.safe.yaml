# =============================================================================
# nld_L1-eng_L2 · B3 · BabyBabelLM HumanScale 100M  ·  GPU-SAFE variant
# =============================================================================
# Mirror of train_nld_L1-eng_L2.yaml with explicit GPU-safety guards added.
# All invariants below are validated by config_gpu_compliance() in
# script/launch/_lib.sh BEFORE any GPU work begins:
#
#   * fabric.devices == NGPUS (default 4 here — BabyBabelLM corpora are smaller
#     so 4 GPUs deliver good throughput without underutilising 8).
#   * fabric.precision == "bf16-mixed"
#   * d_model (768) divisible by attention_n_heads (12) → head_dim 64
#   * global_batch_size == micro_batch (64) * grad_accum (1) * devices (4) = 256
#   * All differential features (ewc / working_memory ALiBi / layer_growth /
#     generative_replay / pre_pretraining / maml) explicitly DISABLED for
#     baseline B3 — flip individually for ablations.
#
# Memory footprint on 4xA100-40G (bf16):
#   ~10 GB params + activations + ~2-3 GB learning_dynamics buffers
#   (compute_gradients=false keeps this OOM-safe).
# =============================================================================
run_name: beetle-bilingual-l2-50-sequential-33-67-b3-humanscale-nld-eng-perlang-safe
hf_user: Beetle-HumanScale

model:
  architecture: pico
  params:
    n_layers: 14
    d_model: 768
    vocab_size: 50000
    attention_n_heads: 12         # 768/12 = 64-dim heads (RoPE-safe integer)
    attention_n_kv_heads: 1       # GQA: 12 query heads share 1 KV head
    max_seq_len: 512
    batch_size: 64                # per-device micro-batch
    position_emb_theta: 10000.0
    activation_hidden_dim: 3072
    norm_eps: 1.0e-05
    dropout: 0.1

data:
  data_mix: B3
  lang_sources:
    - Beetle-HumanScale/nld-50M-eng-nld
  pretokenized: true
  pretokenized_cache_dir: ./pretok_cache/beetle-bilingual-l2-50-sequential-33-67-b3-humanscale-nld-eng-perlang-safe
  l2_streams:
    - Beetle-HumanScale/eng-50M-eng-nld

tokenizer:
  pretrained_tokenizer_path: Beetle-HumanScale/bpe-humanscale-eng-nld
  dataset_source: babybabel
  vocab_size: 50000
  vocab_sharing: per_language
  type: bpe
  target_tokens: 100000000
  compression: equal
  output_dir: ./tokenizers/nld_L1-eng_L2_per_language
  overwrite: false
  push_to_hub: true

training:
  max_steps: 10000
  batch_size: 64
  seq_len: 512
  target_effective_batch: 64
  # Explicit batch parity for config_gpu_compliance schema check:
  global_batch_size: 256          # 64 micro × 1 grad_accum × 4 devices
  micro_batch_size: 64
  fabric:
    accelerator: cuda
    devices: 4                    # MUST equal NGPUS at launch
    strategy: ddp
    precision: bf16-mixed         # required by compliance check
  optimization:
    optimizer: adamw
    lr: 0.0005
    lr_warmup_steps: 500
    lr_scheduler: linear_with_warmup
    gradient_accumulation_steps: 1

checkpointing:
  runs_dir: ./runs
  auto_resume: true
  save_to_hf: true
  export_final_only: false
  keep_local_checkpoints: 1
  learning_dynamics:
    enabled: true
    log_every_n_steps: 1
    batch_size: 64
    sequence_idx: -1
    layer_suffixes:
      - attention
      - swiglu
      - norm
    compute_gradients: false      # critical: keeps memory at ~1x activations
    learning_dynamics_dir: learning_dynamics
    save_training_batch: true
    cleanup_local: true
    keep_n_local: 1
  checkpoint_steps:
    - 0
    - 1
    - 2
    - 4
    - 6
    - 8
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024
    - 2048
    - 4096
    - 8192

curriculum:
  type: smooth
  condition: B3

# ── Differential-feature toggles (ALL OFF — baseline B3) ────────────────────
ewc:
  enabled: false
maml:
  enabled: false
generative_replay:
  enabled: false
pre_pretraining:
  enabled: false
working_memory:
  enabled: false
layer_growth:
  enabled: false
