name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow validates the download-free CPU quickstart (beetlelm.toy):
# it installs only the light dependencies, installs the package without pulling
# the full training stack (Lightning / datasets / wandb / deepspeed), then runs
# the fast toy smoke tests. The full research stack is intentionally not
# exercised here — it targets multi-GPU clusters, not CI runners.

jobs:
  toy-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install light deps + package (no full training stack)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40" "numpy>=1.24" "pyyaml>=6.0" "click>=8.1" pytest
          pip install -e . --no-deps

      - name: Toy quickstart via CLI
        run: beetlelm-toy --config_path configs/smoke.yaml

      - name: Toy smoke tests
        run: pytest -q tests/test_toy_smoke.py
